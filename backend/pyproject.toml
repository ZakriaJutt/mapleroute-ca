[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mapleroute"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn==0.32.1",
  "SQLAlchemy==2.0.57",
  "psycopg[binary]==3.2.13",
  "alembic==1.14.1",
  "cryptography==44.0.3",
  "argon2-cffi==23.1.0",
  "boto3==1.35.99",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.8.6", "mypy==1.13.0"]

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "console*", "worker*", "tools*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "T20"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S603", "S607"]
"tools/*" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["core", "gateway", "console", "worker", "tools", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# botocore 1.35 calls datetime.utcnow() when signing; with that warning recorded, the run stalled for
# about 14 minutes after the last test on this machine (B2). Third-party and harmless; ignored.
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:botocore.auth"]
